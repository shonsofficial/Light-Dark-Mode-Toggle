<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Dark Toggle</title>
    <style>
        body{
            margin: 0;
        }
        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .switch input{
            display: none;  
        }
        .switch label{
            display: block;
            width: 120px;
            height: 50px;
            background: radial-gradient(#bbc0cc, #787c84);
            border: 1px solid #5555;
            border-radius: 40px;
            box-shadow: 0 3px 15px #0005;
            cursor: pointer;
        }
        .switch label button{
            pointer-events: none;
            width: 80%;
            height: 100%;
            border-radius: inherit;
            border: none;
            background: linear-gradient(to right, #c1c4cc 47%, #dddfe5 53%);
            box-shadow: inset -2px 0 2px -1px #fff5, inset 2px 0 2px -1px #fff5;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: .2s;
        }
        .switch label button::before,
        .switch label button::after{
            font-family: Poppins;
            width: 50%;
            content: 'o';
            font-size: xx-large;
            color: #787b84
        }
        .switch label button::after{
            content: '-';
        }
        .switch label button::before{
            color: #eee;
            transform: translateY(-3px);
            text-shadow: 0 2px 2px #555, 0 0 5px #eee;
        }
        .switch label button::after{
            text-shadow: 0 0 5px #fff;
        }
        .switch input:checked ~ label{
            background: radial-gradient(#a787fe, #3c2777);
        }
        .switch input:checked ~ label > button{
            margin-left: 20%;
            background: linear-gradient(to right, #926afe 47%, #754de3 53%);
        }
        .switch input:checked ~label > button::before{
            color: #754de3;
            text-shadow: 0 0 5px #fff5;
        }
        .switch input:checked ~label > button::after{
            color: #eee;
            text-shadow: 0 2px 2px #555, 0 0 5px #eee;
        }
        .darkTheme{
            background-color: #201346;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="switch">
            <input type="checkbox" name="" id="switch">
            <label for="switch"><button></button></label>
        </div>
    </div>
    <script>
        const switchInput = document.getElementById('switch');
        const container = document.querySelector('.container');

        switchInput.addEventListener('change', () => {
            //const audio = new Audio('switch.mp3');
            //audio.play();
            container.classList.toggle('darkTheme');
        })
    </script>
</body>
</html>
